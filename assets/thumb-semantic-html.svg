<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225">
  <defs>
    <clipPath id="docclip">
      <rect x="92" y="24" width="216" height="177" rx="9"/>
    </clipPath>
  </defs>
  <rect width="400" height="225" fill="#0d1635"/>
  <!-- Left angle bracket -->
  <polyline points="64,54 30,112 64,170"
            stroke="#3777ff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Right angle bracket -->
  <polyline points="336,54 370,112 336,170"
            stroke="#3777ff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Document body (clipped to rounded rect) -->
  <g clip-path="url(#docclip)">
    <rect x="92" y="24" width="216" height="177" fill="#152050"/>
    <!-- Header band -->
    <rect x="92" y="24" width="216" height="40" fill="#3777ff"/>
    <!-- Sidebar -->
    <rect x="92" y="64" width="58" height="137" fill="#1e3480"/>
    <!-- Sidebar nav items -->
    <rect x="103" y="78"  width="34" height="8" rx="3" fill="#3777ff" opacity="0.65"/>
    <rect x="103" y="94"  width="28" height="7" rx="3" fill="#3777ff" opacity="0.42"/>
    <rect x="103" y="109" width="34" height="7" rx="3" fill="#3777ff" opacity="0.42"/>
    <rect x="103" y="124" width="22" height="7" rx="3" fill="#3777ff" opacity="0.3"/>
    <!-- Main content heading -->
    <rect x="160" y="74"  width="136" height="14" rx="4" fill="#3777ff" opacity="0.85"/>
    <!-- Content lines -->
    <rect x="160" y="97"  width="116" height="8" rx="3" fill="#ffb5c2" opacity="0.72"/>
    <rect x="160" y="113" width="98"  height="8" rx="3" fill="#ffb5c2" opacity="0.56"/>
    <rect x="160" y="129" width="126" height="8" rx="3" fill="#ffb5c2" opacity="0.44"/>
    <rect x="160" y="145" width="88"  height="8" rx="3" fill="#ffb5c2" opacity="0.32"/>
    <!-- Footer band -->
    <rect x="92" y="177" width="216" height="24" fill="#1e3480"/>
  </g>
</svg>
